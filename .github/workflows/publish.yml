# Publishes to npm when a GitHub release is published, using npm trusted
# publishing (OIDC), then lists that version in the official MCP Registry
# (registry.modelcontextprotocol.io) using GitHub OIDC. No npm token or
# registry credential is stored in the repo or its secrets.
#
# To release: bump "version" in package.json, merge to main, then publish a
# GitHub release with the tag v<version> (e.g. v0.1.5). Re-running a failed
# run is safe: the npm step skips a version that is already published.
name: Publish to npm and the MCP Registry

on:
  release:
    types: [published]

permissions:
  id-token: write # required for trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24" # ships npm 11.5.1+, which trusted publishing needs
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Check the release tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package.json ${version}" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Publish to npm
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm, skipping."
          else
            npm publish --access public
          fi

      - name: Sync server.json versions with package.json
        run: |
          version=$(node -p "require('./package.json').version")
          jq --arg v "$version" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          # The registry checks mcpName on the npm package, which can take a
          # moment to appear after publishing, so retry briefly.
          for attempt in 1 2 3 4 5; do
            if ./mcp-publisher publish; then exit 0; fi
            echo "Attempt $attempt failed, retrying in 30s..."; sleep 30
          done
          exit 1
