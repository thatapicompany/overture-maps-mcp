# Publishes to npm when a GitHub release is published, using npm trusted
# publishing (OIDC). No npm token is stored in the repo or its secrets.
#
# To release: bump "version" in package.json, merge to main, then publish a
# GitHub release with the tag v<version> (e.g. v0.1.3).
name: Publish to npm

on:
  release:
    types: [published]

permissions:
  id-token: write # required for trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24" # ships npm 11.5.1+, which trusted publishing needs
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Check the release tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package.json ${version}" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish --access public
